<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PsyTote</title>
<meta name="description" content="Estudos para o concurso de Psicóloga(o) do CRP/05 – FGV">
<meta name="theme-color" content="#14213d">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">

<body>
<header class="topo">
  <button class="voltar" id="voltar" aria-label="Voltar" hidden>‹</button>
  <h1 id="titulo">PsyTote</h1>
  <span class="relogio" id="relogio" hidden></span>
</header>
<main id="tela" aria-live="polite">
  <p class="carregando">Consultando os papiros de Thoth…</p>
</main>
<nav class="abas" id="abas">
  <button data-ir="inicio"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 1 1 0 6 3 3 0 0 1 0-6zM12 9v12M7 12h10"/></svg></span>Início</button>
  <button data-ir="treino"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg></span>Questões</button>
  <button data-ir="simulado"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg></span>Simulado</button>
  <button data-ir="cronograma"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h3M7 17h6"/></svg></span>Cronograma</button>
  <button data-ir="materiais"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM15 3v4h4M9 12h7M9 16h7"/></svg></span>Materiais</button>
</nav>
<script src="app.js"></script>
